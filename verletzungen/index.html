
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teamarbeit – Verletzungen</title>

  <style>
    :root {
      --star-red: #b00020;
      --page: #f2f4f7;
      --case: #f7f7f7;
      --extra: #eef3f7;
      --text: #222222;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .karte {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      display: block;
      width: 100%;
      max-width: 300px;
      height: auto;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--star-red);
      text-align: center;
      line-height: 1.3;
    }

    .untertitel {
      margin: 0 0 30px;
      color: #666;
      text-align: center;
    }

    .bereich {
      padding: 22px;
      margin-top: 24px;
      border-radius: 10px;
      line-height: 1.7;
    }

    .fall { background: var(--case); }
    .zusatz { background: var(--extra); }

    h2, h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .bereich p { margin-top: 0; }
    .bereich p:last-child { margin-bottom: 0; }
    #anpassungsaufgabe { margin-top: 20px; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .karte { margin: 10px auto; padding: 20px; }
      h1 { font-size: 1.6rem; }
      .bereich { padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="karte">

    <div class="logo">
      <img
        src="https://image.jimcdn.com/app/cms/image/transf/none/path/s4ae4e01473ee480d/image/i451db4a87a702f00/version/1762536248/image.jpg"
        alt="STAR Ambulanz Service"
      >
    </div>

    <h1>Teamarbeit „Verletzungen“</h1>
    <p class="untertitel">
      Erste Hilfe im Betrieb – EH-Grundkurs
    </p>

    <section class="bereich fall">
      <h2>Fall 1</h2>
      <p id="situation-1"></p>
    </section>

    <section class="bereich fall">
      <h2>Fall 2</h2>
      <p id="situation-2"></p>
    </section>

    <section class="bereich zusatz">
      <h3>
        Zusatzaufgabe – Organisation der
        betrieblichen Ersten Hilfe
      </h3>

      <p id="zusatzfrage"></p>

      <p id="anpassungsaufgabe">
        <strong>Anpassung an eure Verhältnisse:</strong>
        <span id="anpassungstext"></span>
      </p>
    </section>

  </main>

  <script>
    "use strict";

    const faelle = [
      {
        typ: "armverletzung",
        situation:
          "Martin Albrecht (39 Jahre) stürzt " +
          "auf einer Treppe im Betriebsgebäude. " +
          "Anschließend klagt er über starke " +
          "Schmerzen am rechten Unterarm und " +
          "am Handgelenk. Der Bereich schwillt " +
          "rasch an und sieht ungewöhnlich " +
          "verformt aus. Herr Albrecht hält " +
          "den verletzten Arm mit der anderen " +
          "Hand fest und möchte ihn möglichst " +
          "nicht bewegen."
      },
      {
        typ: "beinverletzung",
        situation:
          "Claudia Winter (47 Jahre) rutscht " +
          "auf einer nassen Außentreppe zum " +
          "Firmenparkplatz aus. Sie fällt " +
          "unglücklich und bleibt auf den " +
          "Stufen sitzen. Ihr Unterschenkel " +
          "schmerzt stark und schwillt an. " +
          "Frau Winter kann nicht selbstständig " +
          "aufstehen. Eine offene Wunde " +
          "ist nicht zu erkennen."
      },
      {
        typ: "schuerfwunden",
        situation:
          "Daniel Krüger (28 Jahre) stolpert " +
          "im Lager über eine abgestellte " +
          "Transportkiste. Er fällt nach vorne " +
          "und zieht sich Schürfwunden an " +
          "beiden Händen und an einem Knie zu. " +
          "Die Wunden sind leicht verschmutzt " +
          "und bluten etwas. Herr Krüger " +
          "ist wach, ansprechbar und kann " +
          "selbstständig gehen."
      },
      {
        typ: "schnittverletzung",
        situation:
          "Sandra Wolf (36 Jahre) öffnet " +
          "in der Versandabteilung einen " +
          "Karton mit einem Cuttermesser. " +
          "Dabei rutscht sie ab und schneidet " +
          "sich tief in die linke Handfläche. " +
          "Die Wunde blutet stark. Frau Wolf " +
          "ist erschrocken und hält die " +
          "verletzte Hand vor sich."
      }
    ];

    const zusatzaufgaben = [
      {
        frage:
          "Welche Möglichkeiten gibt es, " +
          "eine verletzte Person bis zum " +
          "Eintreffen weiterer Hilfe zu " +
          "betreuen und Schmerzen möglichst " +
          "nicht zu verstärken?",
        anpassung:
          "Überlegt, wo verletzte Mitarbeiter " +
          "in eurem Betrieb sicher betreut " +
          "werden können und welche " +
          "Hilfsmittel dafür vorhanden sind."
      },
      {
        frage:
          "Warum müssen auch kleinere " +
          "Verletzungen und Erste-Hilfe-Leistungen " +
          "im Betrieb dokumentiert werden?",
        anpassung:
          "Findet heraus, wie eine kleine " +
          "Schnitt- oder Schürfwunde an " +
          "eurem Arbeitsplatz dokumentiert " +
          "wird und wo ihr die dafür " +
          "vorgesehene Möglichkeit findet."
      },
      {
        frage:
          "Wer ist für die Kontrolle und " +
          "das Auffüllen des Erste-Hilfe-Materials " +
          "im Betrieb verantwortlich?",
        anpassung:
          "Sucht den nächstgelegenen " +
          "Verbandkasten in eurem Arbeitsbereich. " +
          "Überlegt, wie fehlendes oder " +
          "verbrauchtes Material gemeldet " +
          "und ersetzt wird."
      },
      {
        frage:
          "Was ist bei der betrieblichen " +
          "Meldung eines Arbeitsunfalls " +
          "oder eines Unfalls auf dem " +
          "Arbeitsweg zu beachten?",
        anpassung:
          "Klärt, an wen Mitarbeiter " +
          "in eurem Betrieb einen Unfall " +
          "melden und wo Informationen " +
          "zum weiteren Vorgehen zu finden sind."
      },
      {
        frage:
          "Wie können typische Stolper-, " +
          "Rutsch- und Schnittgefahren " +
          "am Arbeitsplatz erkannt " +
          "und verringert werden?",
        anpassung:
          "Nennt zwei konkrete Gefahrenstellen " +
          "aus eurem Arbeitsbereich und " +
          "überlegt, wie diese gemeldet " +
          "oder beseitigt werden können."
      }
    ];

    const zeitfenster = Math.floor(
      Date.now() / (5 * 60 * 60 * 1000)
    );

    function pseudoZufall(seed) {
      let wert = seed >>> 0;
      wert ^= wert << 13;
      wert ^= wert >>> 17;
      wert ^= wert << 5;
      return wert >>> 0;
    }

    const ersterIndex =
      pseudoZufall(zeitfenster + 0x94f2c1) %
      faelle.length;

    const abstand =
      1 + pseudoZufall(zeitfenster + 0xe63b87) %
      (faelle.length - 1);

    const zweiterIndex =
      (ersterIndex + abstand) % faelle.length;

    const zusatzIndex =
      pseudoZufall(zeitfenster + 0xa71d58) %
      zusatzaufgaben.length;

    document.getElementById("situation-1").textContent =
      faelle[ersterIndex].situation;

    document.getElementById("situation-2").textContent =
      faelle[zweiterIndex].situation;

    document.getElementById("zusatzfrage").textContent =
      zusatzaufgaben[zusatzIndex].frage;

    document.getElementById("anpassungstext").textContent =
      zusatzaufgaben[zusatzIndex].anpassung;
  </script>
</body>
</html>
