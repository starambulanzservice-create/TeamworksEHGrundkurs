
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teamarbeit – Kreislauf</title>

  <style>
    :root {
      --star-red: #b00020;
      --page: #f2f4f7;
      --case: #f7f7f7;
      --extra: #eef3f7;
      --text: #222222;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .karte {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      display: block;
      width: 100%;
      max-width: 300px;
      height: auto;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--star-red);
      text-align: center;
      line-height: 1.3;
    }

    .untertitel {
      margin: 0 0 30px;
      color: #666;
      text-align: center;
    }

    .bereich {
      padding: 22px;
      margin-top: 24px;
      border-radius: 10px;
      line-height: 1.7;
    }

    .fall { background: var(--case); }
    .zusatz { background: var(--extra); }

    h2, h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .bereich p { margin-top: 0; }
    .bereich p:last-child { margin-bottom: 0; }
    #anpassungsaufgabe { margin-top: 20px; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .karte { margin: 10px auto; padding: 20px; }
      h1 { font-size: 1.6rem; }
      .bereich { padding: 18px; }
    }
  </style>
</head>

<body>
  <main class="karte">

    <div class="logo">
      <img
        src="https://image.jimcdn.com/app/cms/image/transf/none/path/s4ae4e01473ee480d/image/i451db4a87a702f00/version/1762536248/image.jpg"
        alt="STAR Ambulanz Service"
      >
    </div>

    <h1>Teamarbeit „Kreislauf“</h1>
    <p class="untertitel">
      Erste Hilfe im Betrieb – EH-Grundkurs
    </p>

    <section class="bereich fall">
      <h2>Fall 1</h2>
      <p id="situation-1"></p>
    </section>

    <section class="bereich fall">
      <h2>Fall 2</h2>
      <p id="situation-2"></p>
    </section>

    <section class="bereich zusatz">
      <h3>
        Zusatzaufgabe – Organisation der
        betrieblichen Ersten Hilfe
      </h3>

      <p id="zusatzfrage"></p>

      <p id="anpassungsaufgabe">
        <strong>Anpassung an eure Verhältnisse:</strong>
        <span id="anpassungstext"></span>
      </p>
    </section>

  </main>

  <script>
    "use strict";

    // Vier Fallsituationen mit festen Namen.
    const faelle = [
      {
        typ: "herzinfarkt",
        situation:
          "Thomas Berger (56 Jahre) nimmt an einer " +
          "Besprechung im Büro teil. Plötzlich klagt " +
          "er über einen starken Druck hinter dem " +
          "Brustbein. Die Beschwerden ziehen bis in " +
          "den linken Arm und in den Unterkiefer. " +
          "Herr Berger ist auffallend blass, " +
          "kaltschweißig und ihm ist übel. " +
          "Er wirkt sehr ängstlich, ist aber wach " +
          "und ansprechbar. Kollegen wissen, dass " +
          "er wegen Bluthochdrucks behandelt wird."
      },
      {
        typ: "schlaganfall",
        situation:
          "Sabine Hoffmann (49 Jahre) sitzt während " +
          "einer Kaffeepause mit Kollegen zusammen. " +
          "Plötzlich spricht sie undeutlich. " +
          "Ein Mundwinkel hängt sichtbar herab. " +
          "Als sie nach ihrer Kaffeetasse greifen " +
          "möchte, fällt auf, dass sie den rechten " +
          "Arm kaum bewegen kann. Die Beschwerden " +
          "haben erst vor wenigen Minuten begonnen. " +
          "Frau Hoffmann ist wach und atmet normal."
      },
      {
        typ: "allergische-reaktion",
        situation:
          "Markus Schneider (38 Jahre) isst bei " +
          "einer Betriebsfeier in der Kantine. " +
          "Kurz darauf bekommt er starken Juckreiz. " +
          "Seine Lippen schwellen an, seine Stimme " +
          "wird heiser und er berichtet, dass sich " +
          "sein Hals eng anfühlt. Außerdem bekommt " +
          "er schlechter Luft und ihm wird schwindelig. " +
          "Herr Schneider ist noch wach. " +
          "Ein Kollege weiß, dass er eine " +
          "Lebensmittelallergie hat."
      },
      {
        typ: "kreislaufschwaeche",
        situation:
          "Julia Neumann (32 Jahre) arbeitet an " +
          "einem warmen Tag in einer Produktionshalle. " +
          "Als sie nach längerem Sitzen aufsteht, " +
          "wird ihr plötzlich schwindelig. " +
          "Sie wird blass und sackt kurz zusammen. " +
          "Als Kollegen zu ihr kommen, ist sie " +
          "wieder wach, fühlt sich aber sehr schwach. " +
          "Frau Neumann erzählt, dass sie heute " +
          "kaum etwas getrunken hat."
      }
    ];

    // Fünf unabhängig wechselnde Zusatzaufgaben.
    const zusatzaufgaben = [
      {
        frage:
          "Wie können betriebliche Ersthelfer bei " +
          "einem plötzlich auftretenden Kreislaufnotfall " +
          "schnell erreicht werden?",
        anpassung:
          "Beschreibt, wie ihr an eurem Arbeitsplatz " +
          "einen Ersthelfer alarmiert. Überlegt auch, " +
          "wie dies in abgelegenen Bereichen oder " +
          "außerhalb der üblichen Arbeitszeiten funktioniert."
      },
      {
        frage:
          "Warum ist es wichtig, bei einem " +
          "medizinischen Notfall den Notruf 112 " +
          "frühzeitig abzusetzen?",
        anpassung:
          "Klärt, wer in eurem Betrieb den Notruf " +
          "übernimmt, welche Ortsangaben benötigt " +
          "werden und wie der Rettungsdienst " +
          "eingewiesen wird."
      },
      {
        frage:
          "Welche Informationen über eine betroffene " +
          "Person sind für die Übergabe an den " +
          "Rettungsdienst besonders hilfreich?",
        anpassung:
          "Überlegt, wie ihr in eurem Betrieb " +
          "den Beginn der Beschwerden, beobachtete " +
          "Veränderungen und durchgeführte " +
          "Erste-Hilfe-Maßnahmen weitergeben könnt."
      },
      {
        frage:
          "Wie können Kollegen eine betroffene " +
          "Person unterstützen, während ein " +
          "Ersthelfer die Versorgung übernimmt?",
        anpassung:
          "Verteilt für euren Arbeitsbereich " +
          "sinnvolle Aufgaben, zum Beispiel " +
          "Notruf absetzen, andere Mitarbeiter " +
          "fernhalten, Material holen und " +
          "den Rettungsdienst einweisen."
      },
      {
        frage:
          "Warum müssen Erste-Hilfe-Leistungen " +
          "im Betrieb dokumentiert werden?",
        anpassung:
          "Findet heraus, wie und wo " +
          "Erste-Hilfe-Leistungen in eurem " +
          "Betrieb dokumentiert werden und " +
          "wer Zugriff auf die vorgesehenen " +
          "Dokumentationsmöglichkeiten hat."
      }
    ];

    // Einheitliches Fünf-Stunden-Zeitfenster.
    const zeitfenster = Math.floor(
      Date.now() / (5 * 60 * 60 * 1000)
    );

    function pseudoZufall(seed) {
      let wert = seed >>> 0;
      wert ^= wert << 13;
      wert ^= wert >>> 17;
      wert ^= wert << 5;
      return wert >>> 0;
    }

    // Zwei verschiedene Fälle.
    const ersterIndex =
      pseudoZufall(zeitfenster + 0x61c8f3) %
      faelle.length;

    const abstand =
      1 + pseudoZufall(zeitfenster + 0xb42d79) %
      (faelle.length - 1);

    const zweiterIndex =
      (ersterIndex + abstand) % faelle.length;

    // Unabhängige Zusatzaufgabe.
    const zusatzIndex =
      pseudoZufall(zeitfenster + 0xd19a47) %
      zusatzaufgaben.length;

    document.getElementById("situation-1").textContent =
      faelle[ersterIndex].situation;

    document.getElementById("situation-2").textContent =
      faelle[zweiterIndex].situation;

    document.getElementById("zusatzfrage").textContent =
      zusatzaufgaben[zusatzIndex].frage;

    document.getElementById("anpassungstext").textContent =
      zusatzaufgaben[zusatzIndex].anpassung;
  </script>
</body>
</html>
