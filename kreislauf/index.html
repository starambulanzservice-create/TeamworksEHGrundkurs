
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teamarbeit – Kreislauf-Notfälle</title>

  <style>
    :root {
      --star-red: #b00020;
      --page: #f2f4f7;
      --case: #f7f7f7;
      --extra: #eef3f7;
      --text: #222222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .karte {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      display: block;
      width: 100%;
      max-width: 300px;
      height: auto;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--star-red);
      text-align: center;
      line-height: 1.3;
    }

    .untertitel {
      margin: 0 0 30px;
      color: #666;
      text-align: center;
    }

    .bereich {
      padding: 22px;
      margin-top: 24px;
      border-radius: 10px;
      line-height: 1.7;
    }

    .fall {
      background: var(--case);
    }

    .zusatz {
      background: var(--extra);
    }

    h2, h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .bereich p {
      margin-top: 0;
    }

    .bereich p:last-child {
      margin-bottom: 0;
    }

    #anpassungsaufgabe {
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .karte {
        margin: 10px auto;
        padding: 20px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .bereich {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="karte">

    <!-- Firmenlogo -->
    <div class="logo">
      <img
        src="https://image.jimcdn.com/app/cms/image/transf/none/path/s4ae4e01473ee480d/image/i451db4a87a702f00/version/1762536248/image.jpg"
        alt="STAR Ambulanz Service"
      >
    </div>

    <h1>Teamarbeit „Kreislauf-Notfälle“</h1>

    <p class="untertitel">
      Erste Hilfe im Betrieb – EH-Grundkurs
    </p>

    <!-- Fallsituation 1 -->
    <section class="bereich fall">
      <h2>Fallsituation 1</h2>
      <p id="situation-1"></p>
    </section>

    <!-- Fallsituation 2 -->
    <section class="bereich fall">
      <h2>Fallsituation 2</h2>
      <p id="situation-2"></p>
    </section>

    <!-- Zusatzaufgabe -->
    <section class="bereich zusatz">

      <h3>
        Zusatzaufgabe – Organisation der
        betrieblichen Ersten Hilfe
      </h3>

      <p id="zusatzfrage"></p>

      <p id="anpassungsaufgabe">
        <strong>Anpassung an eure Verhältnisse:</strong>
        <span id="anpassungstext"></span>
      </p>

    </section>

  </main>

  <script>
    "use strict";

    /*
      VIER FALLSITUATIONEN
      Jeweils zwei werden angezeigt.
    */

    const faelle = [
      {
        typ: "brustschmerz",
        situation:
          "Während einer Besprechung im Büro klagt ein " +
          "56-jähriger Mitarbeiter plötzlich über starken " +
          "Druck hinter dem Brustbein. Die Schmerzen ziehen " +
          "in den linken Arm und den Unterkiefer. Er ist " +
          "blass, kaltschweißig und ihm ist übel. " +
          "Er ist ansprechbar, wirkt aber sehr ängstlich. " +
          "Kollegen wissen, dass er wegen Bluthochdruck " +
          "behandelt wird."
      },
      {
        typ: "schlaganfall",
        situation:
          "Eine 49-jährige Mitarbeiterin spricht während " +
          "einer Kaffeepause im Büro plötzlich undeutlich. " +
          "Ein Mundwinkel hängt herab, und sie kann den " +
          "rechten Arm kaum anheben. Die Auffälligkeiten " +
          "sind vor wenigen Minuten aufgetreten. " +
          "Sie ist wach und atmet normal."
      },
      {
        typ: "allergie",
        situation:
          "Bei einer Feier in der Betriebskantine bekommt " +
          "ein 38-jähriger Mitarbeiter kurz nach dem Essen " +
          "starken Juckreiz. Seine Lippen schwellen an, " +
          "die Stimme wird heiser, und er klagt über Enge " +
          "im Hals, Atemnot und Schwindel. Er ist noch " +
          "ansprechbar. Ein Kollege erwähnt eine bekannte " +
          "Lebensmittelallergie."
      },
      {
        typ: "kollaps",
        situation:
          "Eine 32-jährige Mitarbeiterin steht nach " +
          "längerer Arbeit in einer warmen Produktionshalle " +
          "auf. Ihr wird schwindelig, sie wird auffallend " +
          "blass und sackt kurz zusammen. Als Kollegen zu " +
          "ihr kommen, ist sie wieder ansprechbar, aber " +
          "sehr schwach. Sie hat heute kaum etwas getrunken."
      }
    ];

    /*
      FÜNF ZUSATZAUFGABEN
    */

    const zusatzaufgaben = [
      {
        frage:
          "Welche Bedeutung hat ein AED in der " +
          "betrieblichen Ersten Hilfe und wer darf " +
          "ihn anwenden?",
        anpassung:
          "Findet heraus, ob euer Betrieb über einen " +
          "AED verfügt, wo er hängt und wie Kollegen " +
          "im Notfall dorthin gelangen."
      },
      {
        frage:
          "Wie wird der Rettungsdienst bei einem " +
          "akuten Kreislaufnotfall schnell zum " +
          "richtigen Ort geleitet?",
        anpassung:
          "Wählt einen Raum oder Arbeitsplatz eures " +
          "Betriebs. Beschreibt den Weg vom Notruf " +
          "bis zur Übergabe an den Rettungsdienst."
      },
      {
        frage:
          "Wie können Kollegen die Ersthelfer bei " +
          "einem plötzlich auftretenden Kreislaufnotfall " +
          "unterstützen?",
        anpassung:
          "Verteilt für einen realistischen Notfall " +
          "in eurem Arbeitsbereich die Aufgaben " +
          "Notruf, Betreuung, AED holen und Einweisung."
      },
      {
        frage:
          "Welche Beobachtungen und zeitlichen Angaben " +
          "sind für die Übergabe an den Rettungsdienst " +
          "besonders wichtig?",
        anpassung:
          "Überlegt, wie ihr in eurem Betrieb den " +
          "Beginn der Beschwerden festhalten und " +
          "die Informationen weitergeben könnt."
      },
      {
        frage:
          "Wie sind Ersthelfer und Erste-Hilfe-" +
          "Einrichtungen in eurem Betrieb erreichbar?",
        anpassung:
          "Prüft für einen konkreten Arbeitsplatz " +
          "die Erreichbarkeit von Ersthelfern, " +
          "Verbandkasten und gegebenenfalls AED."
      }
    ];

    /*
      AUTOMATISCHER WECHSEL ALLE 5 STUNDEN
    */

    const zeitfenster = Math.floor(
      Date.now() / (5 * 60 * 60 * 1000)
    );

    function pseudoZufall(seed) {
      let wert = seed >>> 0;

      wert ^= wert << 13;
      wert ^= wert >>> 17;
      wert ^= wert << 5;

      return wert >>> 0;
    }

    /*
      ZWEI UNTERSCHIEDLICHE FÄLLE
    */

    const ersterIndex =
      pseudoZufall(zeitfenster + 0x61c8f3) %
      faelle.length;

    const abstand =
      1 + pseudoZufall(zeitfenster + 0xb42d79) %
      (faelle.length - 1);

    const zweiterIndex =
      (ersterIndex + abstand) % faelle.length;

    /*
      ZUSATZAUFGABE AUSWÄHLEN
    */

    const zusatzIndex =
      pseudoZufall(zeitfenster + 0xd19a47) %
      zusatzaufgaben.length;

    /*
      INHALTE ANZEIGEN
    */

    document.getElementById("situation-1").textContent =
      faelle[ersterIndex].situation;

    document.getElementById("situation-2").textContent =
      faelle[zweiterIndex].situation;

    document.getElementById("zusatzfrage").textContent =
      zusatzaufgaben[zusatzIndex].frage;

    document.getElementById("anpassungstext").textContent =
      zusatzaufgaben[zusatzIndex].anpassung;

  </script>

</body>
</html>
