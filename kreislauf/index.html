
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Teamarbeit – Kreislauf-Notfälle</title>

  <style>
    :root {
      --star-red: #b00020;
      --text: #222;
      --muted: #5f6670;
      --page: #f2f4f7;
      --card: #ffffff;
      --case: #f7f7f7;
      --extra: #eef3f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .karte {
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .logo {
      margin-bottom: 22px;
      text-align: center;
    }

    .logo img {
      width: min(80%, 280px);
      height: auto;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--star-red);
      text-align: center;
      line-height: 1.25;
    }

    .untertitel {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
    }

    .bereich {
      margin-top: 24px;
      padding: 22px;
      border-radius: 10px;
      line-height: 1.65;
    }

    .fall {
      background: var(--case);
    }

    .zusatz {
      background: var(--extra);
    }

    h2, h3 {
      margin: 0 0 12px;
    }

    #situation-1,
    #situation-2,
    #zusatzfrage,
    #anpassungsaufgabe {
      margin: 0;
    }

    #anpassungsaufgabe {
      margin-top: 18px;
    }

    .anpassungs-ueberschrift {
      display: inline-block;
      margin-bottom: 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .karte {
        margin: 10px auto;
        padding: 20px;
      }

      h1 {
        font-size: 1.65rem;
      }

      .bereich {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="karte">

    <!-- Firmenlogo -->
    <div class="logo">
      <img
        src="https://image.jimcdn.com/app/cms/image/transf/none/path/s4ae4e01473ee480d/image/i451db4a87a702f00/version/1762536248/image.jpg"
        alt="STAR Ambulanz Service"
      >
    </div>

    <h1>Teamarbeit „Kreislauf-Notfälle“</h1>

    <p class="untertitel">
      Erste Hilfe im Betrieb – EH-Grundkurs
    </p>

    <!-- Erste Fallsituation -->
    <section class="bereich fall">
      <h2>Fallsituation 1</h2>
      <p id="situation-1"></p>
    </section>

    <!-- Zweite Fallsituation -->
    <section class="bereich fall">
      <h2>Fallsituation 2</h2>
      <p id="situation-2"></p>
    </section>

    <!-- Zusatzaufgabe -->
    <section class="bereich zusatz">

      <h3>
        Zusatzaufgabe – Organisation der
        betrieblichen Ersten Hilfe
      </h3>

      <p id="zusatzfrage"></p>

      <p id="anpassungsaufgabe">
        <strong class="anpassungs-ueberschrift">
          Anpassung an eure Verhältnisse:
        </strong>
        <br>
        <span id="anpassungstext"></span>
      </p>

    </section>

  </main>

  <script>
    "use strict";

    /*
      VIER FALLSITUATIONEN
      Zwei unterschiedliche Fälle werden angezeigt.
    */

    const faelle = [

      {
        typ: "brustschmerz",
        situation:
          "Während einer Besprechung im Büro klagt " +
          "ein 56-jähriger Mitarbeiter plötzlich über " +
          "starken Druck hinter dem Brustbein. " +
          "Die Schmerzen ziehen in den linken Arm " +
          "und den Unterkiefer. Er ist blass, " +
          "kaltschweißig und ihm ist übel. " +
          "Er ist ansprechbar, wirkt aber sehr " +
          "ängstlich. Kollegen wissen, dass er " +
          "wegen Bluthochdruck behandelt wird."
      },

      {
        typ: "schlaganfall",
        situation:
          "Eine 49-jährige Mitarbeiterin spricht " +
          "während einer Kaffeepause im Büro plötzlich " +
          "undeutlich. Ein Mundwinkel hängt herab, " +
          "und sie kann den rechten Arm kaum anheben. " +
          "Die Auffälligkeiten sind vor wenigen " +
          "Minuten aufgetreten. Sie ist wach " +
          "und atmet normal."
      },

      {
        typ: "allergie",
        situation:
          "Bei einer Feier in der Betriebskantine " +
          "bekommt ein 38-jähriger Mitarbeiter kurz " +
          "nach dem Essen starken Juckreiz. " +
          "Seine Lippen schwellen an, die Stimme " +
          "wird heiser, und er klagt über Enge " +
          "im Hals, Atemnot und Schwindel. " +
          "Er ist noch ansprechbar. Ein Kollege " +
          "erwähnt eine bekannte Lebensmittelallergie."
      },

      {
        typ: "kollaps",
        situation:
          "Eine 32-jährige Mitarbeiterin steht " +
          "nach längerer Arbeit in einer warmen " +
          "Produktionshalle auf. Ihr wird schwindelig, " +
          "sie wird auffallend blass und sackt kurz " +
          "zusammen. Als Kollegen zu ihr kommen, " +
          "ist sie wieder ansprechbar, aber sehr " +
          "schwach. Sie hat heute kaum etwas getrunken."
      }

    ];

    /*
      FÜNF ZUSATZAUFGABEN
      Jede enthält eine Frage und eine
      praktische Übertragungsaufgabe.
    */

    const zusatzaufgaben = [

      {
        frage:
          "Welche Bedeutung hat ein AED in der " +
          "betrieblichen Ersten Hilfe und wer " +
          "darf ihn anwenden?",

        anpassung:
          "Findet heraus, ob euer Betrieb über " +
          "einen AED verfügt, wo er hängt und " +
          "wie Kollegen im Notfall dorthin gelangen."
      },

      {
        frage:
          "Wie wird der Rettungsdienst bei einem " +
          "akuten Kreislaufnotfall schnell zum " +
          "richtigen Ort geleitet?",

        anpassung:
          "Wählt einen Raum oder Arbeitsplatz " +
          "eures Betriebs. Beschreibt den Weg " +
          "vom Notruf bis zur Übergabe an " +
          "den Rettungsdienst."
      },

      {
        frage:
          "Wie können Kollegen die Ersthelfer " +
          "bei einem plötzlich auftretenden " +
          "Kreislaufnotfall unterstützen?",

        anpassung:
          "Verteilt für einen realistischen Notfall " +
          "in eurem Arbeitsbereich die Aufgaben " +
          "Notruf, Betreuung, AED holen und Einweisung."
      },

      {
        frage:
          "Welche Beobachtungen und zeitlichen " +
          "Angaben sind für die Übergabe an den " +
          "Rettungsdienst besonders wichtig?",

        anpassung:
          "Überlegt, wie ihr in eurem Betrieb " +
          "den Beginn der Beschwerden festhalten " +
          "und die Informationen weitergeben könnt."
      },

      {
        frage:
          "Wie sind Ersthelfer und Erste-Hilfe-" +
          "Einrichtungen in eurem Betrieb erreichbar?",

        anpassung:
          "Prüft für einen konkreten Arbeitsplatz " +
          "die Erreichbarkeit von Ersthelfern, " +
          "Verbandkasten und gegebenenfalls AED."
      }

    ];

    /*
      ZEITFENSTER: FÜNF STUNDEN
    */

    const zeitfenster = Math.floor(
      Date.now() / (5 * 60 * 60 * 1000)
    );

    /*
      PSEUDOZUFALLSFUNKTION
      Gleicher Zeitblock = gleiche Auswahl.
    */

    function pseudoZufall(seed) {
      let wert = seed >>> 0;

      wert ^= wert << 13;
      wert ^= wert >>> 17;
      wert ^= wert << 5;

      return wert >>> 0;
    }

    /*
      ZWEI UNTERSCHIEDLICHE FÄLLE AUSWÄHLEN
    */

    const ersterIndex =
      pseudoZufall(zeitfenster + 0x61c8f3) %
      faelle.length;

    const abstand =
      1 + pseudoZufall(zeitfenster + 0xb42d79) %
      (faelle.length - 1);

    const zweiterIndex =
      (ersterIndex + abstand) % faelle.length;

    /*
      ZUSATZAUFGABE GETRENNT AUSWÄHLEN
    */

    const zusatzIndex =
      pseudoZufall(zeitfenster + 0xd19a47) %
      zusatzaufgaben.length;

    /*
      INHALTE AUF DER WEBSEITE ANZEIGEN
    */

    document.getElementById("situation-1").textContent =
      faelle[ersterIndex].situation;

    document.getElementById("situation-2").textContent =
      faelle[zweiterIndex].situation;

    document.getElementById("zusatzfrage").textContent =
      zusatzaufgaben[zusatzIndex].frage;

    document.getElementById("anpassungstext").textContent =
      zusatzaufgaben[zusatzIndex].anpassung;

  </script>

</body>
</html>
