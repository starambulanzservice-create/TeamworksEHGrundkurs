<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Teamarbeit Atmungs-Notfälle</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .karte {
      max-width: 720px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #b00020;
      margin-bottom: 25px;
    }

    .fall {
      background: #f7f7f7;
      padding: 22px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .fall h2 {
      margin-top: 0;
      color: #333;
    }

    .zusatz {
      margin-top: 25px;
      background: #eef3f7;
      padding: 22px;
      border-radius: 10px;
      line-height: 1.6;
    }

    .zusatz h3 {
      margin-top: 0;
      color: #333;
    }
  </style>
</head>

<body>

<div class="karte">

  <h1>Teamarbeit „Atmungs-Notfälle“</h1>

  <div class="fall">
    <h2 id="titel"></h2>
    <p id="situation"></p>
  </div>

  <div class="zusatz">
    <h3>Zusatzaufgabe – Betriebliche Erste Hilfe</h3>
    <p id="zusatz"></p>
  </div>

</div>


<script>

/* =========================================
   POOL 1: EINSATZSITUATIONEN
   ========================================= */

const faelle = [

  {
    titel: "Einsatzsituation 1",
    situation:
      "Eine 34-jährige Mitarbeiterin hält während einer Teamsitzung in einem Besprechungsraum eine Präsentation. Plötzlich unterbricht sie ihren Vortrag und berichtet, dass sie zunehmend schlecht Luft bekomme. Sie setzt sich hin, beugt den Oberkörper leicht nach vorne und stützt ihre Arme auf den Oberschenkeln ab. Ihre Atmung ist deutlich beschleunigt. Beim Ausatmen ist ein pfeifendes Atemgeräusch zu hören. Sie kann nur noch kurze Sätze sprechen und wirkt zunehmend ängstlich. Auf Nachfrage berichtet sie, dass bei ihr Asthma bekannt ist und sich ihr ärztlich verordnetes Asthmaspray in ihrer Handtasche befindet."
  },

  {
    titel: "Einsatzsituation 2",
    situation:
      "Ein 45-jähriger Mitarbeiter sitzt während seiner Mittagspause mit mehreren Kollegen in der Betriebskantine. Während des Essens greift er sich plötzlich an den Hals und steht hektisch auf. Er versucht zu sprechen, kann jedoch kaum einen Ton hervorbringen. Auch kräftiges Husten gelingt ihm nicht mehr. Er wirkt panisch und bekommt offensichtlich kaum Luft. Nach kurzer Zeit verfärben sich seine Lippen leicht bläulich. Der Mitarbeiter ist zunächst noch bei Bewusstsein, seine Bewegungen werden jedoch zunehmend schwächer."
  },

  {
    titel: "Einsatzsituation 3",
    situation:
      "Ein 57-jähriger Mitarbeiter kommt morgens vom Firmenparkplatz in Richtung Verwaltungsgebäude. Kurz vor dem Eingang bleibt er stehen und klagt über starke Atemnot. Er setzt sich auf eine niedrige Mauer, beugt den Oberkörper nach vorne und stützt die Arme auf den Knien ab. Seine Atmung ist schnell und deutlich angestrengt. Fragen kann er nur noch mit einzelnen Worten beantworten. Seine Lippen wirken leicht bläulich und er erscheint erschöpft. Er berichtet, dass bei ihm seit mehreren Jahren eine chronische Lungenerkrankung bekannt ist und er regelmäßig Medikamente zur Erweiterung der Atemwege benutzt."
  }

];


/* =========================================
   POOL 2: ZUSATZAUFGABEN
   ========================================= */

const zusatzfragen = [

  "Wie kann im Betrieb sichergestellt werden, dass Ersthelfer für alle Mitarbeiter schnell erreichbar beziehungsweise auffindbar sind?",

  "Wie sollte die Einweisung des Rettungsdienstes organisiert werden, damit die Einsatzkräfte ohne Zeitverlust zum Patienten gelangen?",

  "Welche Bedeutung hat die regelmäßige Aus- und Fortbildung betrieblicher Ersthelfer für die Versorgung eines solchen Notfalls?",

  "Welche Aufgaben können weitere Kollegen übernehmen, während ein Ersthelfer die betroffene Person versorgt?",

  "Wie sollte im Betrieb sichergestellt werden, dass auch in abgelegenen Bereichen, auf dem Betriebsgelände oder auf dem Firmenparkplatz schnell Erste Hilfe geleistet werden kann?"

];


/* =========================================
   DEMOMODUS
   Neues Zeitfenster alle 30 Sekunden
   ========================================= */

const jetzt = new Date();

const zeitblock =
  Math.floor(jetzt.getTime() / (30 * 1000));


/* =========================================
   ZWEI GETRENNTE AUSLOSUNGEN

   Die unterschiedlichen Berechnungen sorgen
   dafür, dass Einsatz und Zusatzaufgabe nicht
   einfach immer gemeinsam durchlaufen.
   ========================================= */

const fallNummer =
  (zeitblock * 7 + 2) % faelle.length;

const zusatzNummer =
  (zeitblock * 11 + 3) % zusatzfragen.length;


/* =========================================
   AUSGABE
   ========================================= */

document.getElementById("titel").textContent =
  faelle[fallNummer].titel;

document.getElementById("situation").textContent =
  faelle[fallNummer].situation;

document.getElementById("zusatz").textContent =
  zusatzfragen[zusatzNummer];

</script>

</body>
</html>
